name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pytest

      - name: Validate Python syntax
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest -q

  sonarqube:
    name: SonarQube analysis and quality gate
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarQube and enforce the quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  docker-build-and-scan:
    name: Build and scan image
    needs:
      - test
      - sonarqube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image with an immutable commit tag
        id: image
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          docker build --tag "${image_ref}" .

      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          severity: CRITICAL

      - name: Save image for the publish job
        run: docker save --output "${RUNNER_TEMP}/devsecops-image.tar" "${{ steps.image.outputs.image_ref }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-image
          path: ${{ runner.temp }}/devsecops-image.tar
          retention-days: 1

  publish-image:
    name: Publish image to GHCR
    needs: docker-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image_ref: ${{ needs.docker-build-and-scan.outputs.image_ref }}

    steps:
      - name: Download scanned image artifact
        uses: actions/download-artifact@v4
        with:
          name: devsecops-image
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: docker load --input "${RUNNER_TEMP}/devsecops-image.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        env:
          IMAGE_REF: ${{ needs.docker-build-and-scan.outputs.image_ref }}
        run: docker push "${IMAGE_REF}"

  deploy:
    name: Deploy and verify on KIND
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create KIND cluster
        uses: helm/kind-action@v1.12.0

      - name: Verify cluster nodes
        run: kubectl get nodes

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yml

      - name: Configure GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace devsecops \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${GHCR_TOKEN}" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -
          kubectl patch serviceaccount default \
            --namespace devsecops \
            --type=merge \
            --patch='{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

      - name: Apply Deployment and Service
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Set the commit-specific image
        env:
          IMAGE_REF: ${{ needs.publish-image.outputs.image_ref }}
        run: kubectl set image deployment/devsecops devsecops="${IMAGE_REF}" --namespace devsecops

      - name: Wait for rollout
        run: kubectl rollout status deployment/devsecops --namespace devsecops --timeout=180s

      - name: Inspect deployed resources
        run: |
          kubectl get namespace
          kubectl get pods --namespace devsecops
          kubectl get deployment --namespace devsecops
          kubectl get service --namespace devsecops

      - name: Verify application endpoints
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward --namespace devsecops service/devsecops 18080:80 \
            > "${RUNNER_TEMP}/kubectl-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "${port_forward_pid}" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "${ready}" != "true" ]]; then
            cat "${RUNNER_TEMP}/kubectl-port-forward.log"
            echo "The application did not become reachable through the Kubernetes Service."
            exit 1
          fi

          home_response="$(curl --silent --show-error --fail http://127.0.0.1:18080/)"
          health_response="$(curl --silent --show-error --fail http://127.0.0.1:18080/health)"
          test "${home_response}" = "Hello from DevSecOps Kubernetes Application!"
          test "${health_response}" = "UP"
          printf 'GET /        -> %s\nGET /health -> %s\n' "${home_response}" "${health_response}"
